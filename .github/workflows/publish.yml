# Publication workflow for GitHub Pages (DEC-010, REQ-006, T13, M1.6)
# Deploys only verified canonical documentation and genuinely approved derived views on push to main.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Filter for production (AD-9, T12, E3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_filter.py --mode production --require-api

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: prototype/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Deployment smoke check with retry (T13, B3.4)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'EOF'
          import os, sys, time, urllib.request

          base = os.environ.get("PAGE_URL", "").rstrip("/")
          if not base:
              print("PAGE_URL not set; skipping live HTTP probe.")
              sys.exit(0)

          paths = [
              "",
              "docs/overview",
              "views/recruiter/project-overview",
              "hu/",
              "search-index.json"
          ]

          max_retries = 5
          backoff_seconds = 5

          for p in paths:
              url = f"{base}/{p}".rstrip("/") if not p.endswith("/") and p else f"{base}/{p}"
              success = False
              for attempt in range(1, max_retries + 1):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "DOCCAD-SmokeCheck/1.0"})
                      with urllib.request.urlopen(req, timeout=15) as res:
                          if res.status == 200:
                              print(f"PASS [attempt {attempt}]: {url} -> 200 OK")
                              success = True
                              break
                          print(f"WARN [attempt {attempt}]: {url} returned HTTP {res.status}")
                  except Exception as e:
                      print(f"WARN [attempt {attempt}]: {url} probe error: {e}")
                  if attempt < max_retries:
                      time.sleep(backoff_seconds)

              if not success:
                  print(f"FAIL: {url} failed after {max_retries} attempts.", file=sys.stderr)
                  sys.exit(1)

          print("All live deployment smoke probes passed successfully.")
          EOF
