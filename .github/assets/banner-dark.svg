  <text x="72" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#58a6ff">PRE-DOCCAD · RESEARCH ARCHIVE + PROTOTYPE</text>
  <text x="68" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#e6edf3">DOCCAD</text>
  <text x="72" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#e6edf3">Canonical docs in git. Governed AI views on top.</text>
  <text x="72" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Humans own the source. AI derives the views.</text>
  <text x="72" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Every view cites its sources by hash.</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8b949e">
    <rect x="72" y="314" width="120" height="28" rx="14" fill="#1f6feb26" stroke="#30363d"/>
    <text x="132" y="333" text-anchor="middle">docs-as-code</text>
    <rect x="202" y="314" width="160" height="28" rx="14" fill="#1f6feb26" stroke="#30363d"/>
    <text x="282" y="333" text-anchor="middle">sha256 provenance</text>
    <rect x="372" y="314" width="144" height="28" rx="14" fill="#1f6feb26" stroke="#30363d"/>
    <text x="444" y="333" text-anchor="middle">zero runtime AI</text>
  </g>

  <g>
    <rect x="760" y="40" width="440" height="116" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="759" y="58" width="4" height="80" rx="2" fill="#3fb950"/>
