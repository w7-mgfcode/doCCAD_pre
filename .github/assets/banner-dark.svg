    <text x="804" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#a371f7">GENERATED</text>
