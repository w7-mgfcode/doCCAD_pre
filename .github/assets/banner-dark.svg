<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">DOCCAD</title>
  <desc id="desc">Canonical documentation in git; governed AI views derived from it, with sha256 provenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/><stop offset="0.55" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="158" x2="0" y2="202">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
