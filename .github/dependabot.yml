# Dependabot configuration (AD-8, T9, M2.2)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/prototype"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
